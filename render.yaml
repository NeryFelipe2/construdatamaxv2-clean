services:
  - type: web
    name: construdatamaxv2-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/main.py
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CONSTRUDATA_API_BASE_URL
        sync: false
      - key: CONSTRUDATA_RUN_STARTUP_DB_TASKS
        value: "false"
      - key: DATABASE_CONNECT_TIMEOUT_SECONDS
        value: "5"
      - key: DATABASE_STARTUP_STATEMENT_TIMEOUT_MS
        value: "5000"
