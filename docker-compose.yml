# ============================================================
# NOVA NS v5 — Docker Compose LOCAL (100% ISOLADO)
# ============================================================
# USO: docker compose up -d
# RAM TOTAL MÁXIMO: ~960MB (otimizado para máquinas com 8-16GB)
# 
# PORTAS EXCLUSIVAS (não conflita com ConstruData Web):
#   Postgres: 5433 | Redis: 6380 | N8N: 5679 | Evolution: 8081
#   Portainer: 9001
# ============================================================

services:
  # ---------- BANCO DE DADOS ----------
  postgres:
    image: postgres:16-alpine
    container_name: ns5-postgres
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    environment:
      POSTGRES_USER: ns5_admin
      POSTGRES_PASSWORD: Ns5Eng2026!SecurePass
      POSTGRES_DB: ns5_main
    command: >
      postgres
        -c shared_buffers=64MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c effective_cache_size=128MB
        -c max_connections=30
        -c wal_buffers=2MB
        -c checkpoint_completion_target=0.9
    volumes:
      - ns5_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ns5_admin"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------- CACHE / FILA ----------
  redis:
    image: redis:7-alpine
    container_name: ns5-redis
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    command: >
      redis-server
        --requirepass Ns5Redis2026!Pass
        --appendonly yes
        --maxmemory 48mb
        --maxmemory-policy allkeys-lru
        --save 300 10
    volumes:
      - ns5_redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Ns5Redis2026!Pass", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------- N8N (Automações) ----------
  n8n:
    image: n8nio/n8n:latest
    container_name: ns5-n8n
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.75
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Banco (usa o Postgres INTERNO do compose, não o externo)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=ns5_main
      - DB_POSTGRESDB_USER=ns5_admin
      - DB_POSTGRESDB_PASSWORD=Ns5Eng2026!SecurePass
      # Config
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5679/
      - N8N_ENCRYPTION_KEY=chave-local-ns5-2026-isolado
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_DEFAULT_LOCALE=pt-BR
      # Desabilita task runner (causa crash loop)
      - N8N_RUNNERS_DISABLED=true
      - N8N_RUNNERS_MODE=internal
      # Otimizações de memória
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - N8N_METRICS=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - NODE_OPTIONS=--max-old-space-size=256
    volumes:
      - ns5_n8n_data:/home/node/.n8n
    ports:
      - "5679:5678"


  # ---------- EVOLUTION API (WhatsApp) ----------
  evolution:
    image: atendai/evolution-api:latest
    container_name: ns5-evolution
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Servidor
      - SERVER_URL=http://localhost:8081
      - SERVER_PORT=8080
      # Auth
      - AUTHENTICATION_API_KEY=Ns5Evolution2026!ApiKey
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      # Banco (interno ao compose)
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://ns5_admin:Ns5Eng2026!SecurePass@postgres:5432/ns5_main?schema=evolution_ns5
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_ns5
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      # Redis (interno ao compose)
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:Ns5Redis2026!Pass@redis:6379
      - CACHE_REDIS_PREFIX_KEY=ns5_evo
      - CACHE_LOCAL_ENABLED=false
      # Transcrição
      - OPENAI_ENABLED=true
      # Webhook
      - WEBHOOK_GLOBAL_ENABLED=false
      # Logs
      - LOG_LEVEL=WARN
      - CORS_ORIGIN=*
      - TZ=America/Sao_Paulo
    volumes:
      - ns5_evolution_data:/evolution/instances
    ports:
      - "8081:8080"

  # ---------- PORTAINER (Gerenciador Visual) ----------
  portainer:
    image: portainer/portainer-ce:latest
    container_name: ns5-portainer
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ns5_portainer_data:/data
    ports:
      - "9001:9000"
      - "9444:9443"

volumes:
  ns5_postgres_data:
  ns5_redis_data:
  ns5_n8n_data:
  ns5_evolution_data:
  ns5_portainer_data:
