<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ConstruDataMaxV2 | Manage NS</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080810;--s1:#0e0e1a;--s2:#161628;--brd:#252540;--acc:#00ff88;--red:#ff4455;
--yel:#ffcc00;--blu:#4488ff;--cyn:#00ccff;--txt:#dde;--dim:#556;
--font:'Segoe UI',system-ui,sans-serif;--mono:monospace}
body{background:var(--bg);color:var(--txt);font-family:var(--font);overflow:hidden;height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--s1);border-bottom:1px solid var(--brd);height:40px;display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;z-index:10}
.logo{font-size:15px;font-weight:700;color:var(--acc)}.logo span{color:var(--dim);font-weight:300;font-size:12px}
.sep{width:1px;height:18px;background:var(--brd)}
.btn{padding:4px 10px;font-size:10px;border:1px solid var(--brd);border-radius:3px;background:var(--s2);color:var(--txt);cursor:pointer;font-family:var(--font);transition:.2s}
.btn:hover{border-color:var(--acc);color:var(--acc)}.btn.on{background:rgba(0,255,136,.12);border-color:var(--acc);color:var(--acc)}
.topbar .info{margin-left:auto;font-size:9px;color:var(--dim);font-family:var(--mono)}
.main{display:flex;flex:1;overflow:hidden}
.left{width:220px;background:var(--s1);border-right:1px solid var(--brd);overflow-y:auto;flex-shrink:0;font-size:11px}
.pt{font-size:10px;font-weight:700;color:var(--acc);padding:8px 10px 4px;text-transform:uppercase;letter-spacing:.5px}
.ti{padding:4px 10px 4px 16px;cursor:pointer;border-left:2px solid transparent;transition:.15s}
.ti:hover{background:rgba(255,255,255,.03);border-left-color:var(--acc)}.ti.sel{background:rgba(0,255,136,.06);border-left-color:var(--acc);color:var(--acc)}
.ti .c{color:var(--dim);font-family:var(--mono);font-size:9px}
.center{flex:1;position:relative}
#cv{width:100%;height:100%;display:block}
.ov{position:absolute;background:rgba(10,10,18,.85);border:1px solid var(--brd);border-radius:6px;padding:10px;backdrop-filter:blur(5px);font-size:11px}
.ov-stats{top:8px;right:8px;min-width:160px}
.ov-ctrl{bottom:70px;left:8px;display:flex;flex-direction:column;gap:6px}
.sr{display:flex;justify-content:space-between;padding:2px 0}.sr .v{font-family:var(--mono);font-weight:700;color:var(--acc)}.sr .v.cost{color:var(--yel)}
.right{width:260px;background:var(--s1);border-left:1px solid var(--brd);overflow-y:auto;flex-shrink:0}
.ps{padding:8px 10px;border-bottom:1px solid var(--brd)}
.ps h4{font-size:9px;font-weight:700;color:var(--acc);text-transform:uppercase;margin-bottom:4px}
.pr{display:flex;justify-content:space-between;font-size:11px;padding:1px 0}.pr .k{color:var(--dim)}.pr .v{font-family:var(--mono);text-align:right}
.pr .v.ok{color:var(--acc)}.pr .v.fail{color:var(--red)}.pr .v.cost{color:var(--yel)}
.nosel{padding:20px 12px;text-align:center;color:var(--dim);font-size:11px}
.tl{height:50px;background:var(--s1);border-top:1px solid var(--brd);padding:6px 12px;flex-shrink:0;display:flex;align-items:center;gap:10px}
.tl label{font-size:9px;color:var(--dim);text-transform:uppercase;min-width:50px}
.tl input[type=range]{flex:1;accent-color:var(--acc);height:3px}
.tl .ph{font-size:11px;font-weight:700;color:var(--acc);font-family:var(--mono);min-width:100px}
.pb{width:24px;height:24px;border-radius:50%;border:1px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,255,136,.12);border:1px solid var(--acc);border-radius:3px;padding:3px 8px;font-size:10px;font-weight:700;color:var(--acc)}
.slider-row{display:flex;align-items:center;gap:6px}
.slider-row label{font-size:9px;color:var(--dim);min-width:50px}
.slider-row input{width:80px;accent-color:var(--acc)}
.slider-row .val{font-size:10px;font-family:var(--mono);color:var(--acc);min-width:30px}
</style>
</head>

  // Pipes
  REDE_DATA.edges.forEach((e,i)=>{
    const z0=zT(e.z0),z1=zT(e.z1);
    const dx=e.x1-e.x0,dy=z1-z0,dz=e.y1-e.y0;
    const len=Math.sqrt(dx*dx+dy*dy+dz*dz);if(len<.5)return;
    const r=e.dn/2000*pipeScale;
    const geo=new THREE.CylinderGeometry(r,r,len,8,1,false);
    const mat=new THREE.MeshPhongMaterial({color:0x00cc66,transparent:true,opacity:.85});
    const m=new THREE.Mesh(geo,mat);
    m.position.set((e.x0+e.x1)/2,(z0+z1)/2,(e.y0+e.y1)/2);
    const dir=new THREE.Vector3(dx,dy,dz).normalize();
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
    m.userData={type:'pipe',idx:i,data:e};
    scene.add(m);pipes.push(m);
  });
  
  // PVs
  REDE_DATA.nodes.forEach((n,i)=>{
    const z=zT(n.cf);
    const h=Math.max(n.p*zExag*.5,1);
    const r=n.t==='PV'?2:1.4;
    const geo=new THREE.CylinderGeometry(r*1.2,r,h,10);
    const mat=new THREE.MeshPhongMaterial({color:n.t==='PV'?0x3366ff:0x5599dd,transparent:true,opacity:.9});
    const m=new THREE.Mesh(geo,mat);
    m.position.set(n.x,z+h/2,n.y);
    m.userData={type:'pv',idx:i,data:n};
    scene.add(m);pvms.push(m);
  });
  
  // Reapply view mode
  setViewColors();
}

function setZScale(v){zExag=parseInt(v);document.getElementById('zval').textContent=v+'×';buildNetwork();}
function setPipeScale(v){pipeScale=parseInt(v);document.getElementById('pval').textContent=v+'×';buildNetwork();}

// ═══ View modes ═══
let viewMode='3d';
function costCol(c){const t=Math.min(c/5000,1);return new THREE.Color().setHSL(.33*(1-t),.9,.5)}
function velCol(v){return v<.6?new THREE.Color(0xff4455):v>3?new THREE.Color(0xffcc00):new THREE.Color(0x00ff88)}
function dnCol(dn){return dn<=150?new THREE.Color(0x4488ff):dn<=200?new THREE.Color(0x00ff88):dn<=300?new THREE.Color(0xffcc00):new THREE.Color(0xff4455)}

function setViewColors(){
  pipes.forEach(m=>{const e=m.userData.data;if(!e)return;
    if(viewMode==='cost')m.material.color=costCol(e.c);
    else if(viewMode==='vel')m.material.color=velCol(e.v);
    else if(viewMode==='dn')m.material.color=dnCol(e.dn);
    else m.material.color.setHex(0x00cc66);
  });
}
function setView(mode){
  viewMode=mode;
  document.querySelectorAll('.topbar .btn').forEach(b=>b.classList.remove('on'));
  document.getElementById({cost:'bcost',vel:'bvel',dn:'bdn','3d':'b3d'}[mode]).classList.add('on');
  document.getElementById('badge').textContent={cost:'5D CUSTOS',vel:'HIDRÁULICA',dn:'DIÂMETRO','3d':'3D MODEL'}[mode];
  setViewColors();
}
function toggleWire(){pipes.forEach(m=>m.material.wireframe=!m.material.wireframe);pvms.forEach(m=>m.material.wireframe=!m.material.wireframe)}

// ═══ Raycasting ═══
const rc=new THREE.Raycaster(),mo=new THREE.Vector2();
let sel=null;
cv.onclick=e=>{
  const r=cv.getBoundingClientRect();
  mo.x=((e.clientX-r.left)/r.width)*2-1;mo.y=-((e.clientY-r.top)/r.height)*2+1;
  rc.setFromCamera(mo,cam);
  const h=rc.intersectObjects([...pipes,...pvms]);
  if(sel){sel.material.emissive.setHex(0);sel=null;}
  if(h.length>0){sel=h[0].object;sel.material.emissive.setHex(0x222222);showProps(sel.userData);}
  else{document.getElementById('pp').innerHTML='<div class="nosel">Clique num elemento</div>';}
};
function showProps(u){
  const p=document.getElementById('pp');
  if(u.type==='pipe'){const e=u.data;const vOk=e.v>=.6?'ok':'fail';
    p.innerHTML=`<div class="ps"><h4>🔧 Tubo</h4>
      <div class="pr"><span class="k">Trecho</span><span class="v">${e.a} → ${e.b}</span></div>
      <div class="pr"><span class="k">DN</span><span class="v">${e.dn} mm</span></div>
      <div class="pr"><span class="k">Material</span><span class="v">${e.mat}</span></div>
      <div class="pr"><span class="k">Extensão</span><span class="v">${e.ext} m</span></div>
      <div class="pr"><span class="k">Velocidade</span><span class="v ${vOk}">${e.v} m/s</span></div>
      <div class="pr"><span class="k">CF mont.</span><span class="v">${e.z0} m</span></div>
      <div class="pr"><span class="k">CF jus.</span><span class="v">${e.z1} m</span></div>
    </div><div class="ps"><h4>💰 Custo 5D</h4>
      <div class="pr"><span class="k">Tubulação</span><span class="v cost">R$ ${e.ct.toLocaleString('pt-BR')}</span></div>
      <div class="pr"><span class="k">Escavação</span><span class="v cost">R$ ${e.ce.toLocaleString('pt-BR')}</span></div>
      <div class="pr"><span class="k">Reaterro</span><span class="v cost">R$ ${e.cr.toLocaleString('pt-BR')}</span></div>
      <div class="pr"><span class="k">Reposição</span><span class="v cost">R$ ${e.cp.toLocaleString('pt-BR')}</span></div>
      <div class="pr" style="border-top:1px solid var(--brd);margin-top:3px;padding-top:3px"><span class="k"><b>TOTAL</b></span><span class="v cost"><b>R$ ${e.c.toLocaleString('pt-BR')}</b></span></div>
    </div><div class="ps"><h4>📐 Catálogo</h4>
      <div class="pr"><span class="k">Norma</span><span class="v">NBR 9649</span></div>
      <div class="pr"><span class="k">Fabricante</span><span class="v">Tigre</span></div>
      <div class="pr"><span class="k">Manning</span><span class="v">0.013</span></div>
    </div>`;
  }else{const n=u.data;
    p.innerHTML=`<div class="ps"><h4>🔵 ${n.t==='PV'?'Poço de Visita':'Poço Inspeção'}</h4>
      <div class="pr"><span class="k">Nome</span><span class="v">${n.n}</span></div>
      <div class="pr"><span class="k">CT</span><span class="v">${n.ct} m</span></div>
      <div class="pr"><span class="k">CF</span><span class="v">${n.cf} m</span></div>
      <div class="pr"><span class="k">Prof.</span><span class="v">${n.p} m</span></div>
      <div class="pr"><span class="k">E</span><span class="v">${(n.x+REDE_DATA.ox).toFixed(1)}</span></div>
      <div class="pr"><span class="k">N</span><span class="v">${(n.y+REDE_DATA.oy).toFixed(1)}</span></div>
    </div><div class="ps"><h4>💰 Custo</h4>
      <div class="pr"><span class="k">Tipo</span><span class="v">${n.t==='PV'?'Concreto Ø1200':'Plástico Ø600'}</span></div>
      <div class="pr"><span class="k"><b>TOTAL</b></span><span class="v cost"><b>R$ ${n.c.toLocaleString('pt-BR')}</b></span></div>
    </div>`;
  }
}

// ═══ Timeline ═══
let cPh=12,playing=false;
function setPhase(ph){cPh=parseInt(ph);
  document.getElementById('plabel').textContent=cPh>=12?'Completa':PH[cPh]||'Fase '+cPh;
  pipes.forEach(m=>{const e=m.userData.data;if(!e)return;m.visible=e.ph<=cPh;m.material.opacity=e.ph===cPh?1:.7;});
}
function togglePlay(){playing=!playing;document.getElementById('pbtn').textContent=playing?'⏸':'▶';if(playing)playStep();}
function playStep(){if(!playing)return;let ph=parseInt(document.getElementById('tslider').value);
  ph=ph>=12?1:ph+1;document.getElementById('tslider').value=ph;setPhase(ph);setTimeout(playStep,1000);}

// ═══ Filters ═══
function filterAll(){pipes.forEach(m=>m.visible=true);pvms.forEach(m=>m.visible=true);}
function filterType(t){pvms.forEach(m=>m.visible=m.userData.data.t===t);}
function filterDN(dn){pipes.forEach(m=>{const e=m.userData.data;m.visible=e&&e.dn===dn;});}

// ═══ Stats ═══
function updStats(){
  const nPV=REDE_DATA.nodes.filter(n=>n.t==='PV').length;
  const tc=REDE_DATA.edges.reduce((s,e)=>s+e.c,0)+REDE_DATA.nodes.reduce((s,n)=>s+n.c,0);
  const te=REDE_DATA.edges.reduce((s,e)=>s+e.ext,0);
  document.getElementById('stats').innerHTML=`
    <div class="sr"><span>Tubos</span><span class="v">${REDE_DATA.edges.length}</span></div>
    <div class="sr"><span>PVs/PIs</span><span class="v">${REDE_DATA.nodes.length}</span></div>
    <div class="sr"><span>Extensão</span><span class="v">${te.toFixed(0)}m</span></div>
    <div class="sr"><span>5D Total</span><span class="v cost">R$ ${(tc/1000).toFixed(0)}k</span></div>`;
  document.getElementById('ca').textContent=`(${REDE_DATA.edges.length})`;
  document.getElementById('cpv').textContent=`(${nPV})`;
  document.getElementById('cpi').textContent=`(${REDE_DATA.nodes.length-nPV})`;
  document.getElementById('c200').textContent=`(${REDE_DATA.edges.filter(e=>e.dn===200).length})`;
  document.getElementById('c300').textContent=`(${REDE_DATA.edges.filter(e=>e.dn===300).length})`;
  document.getElementById('c400').textContent=`(${REDE_DATA.edges.filter(e=>e.dn===400).length})`;
  const cc={t:0,e:0,r:0,p:0,pv:0};
  REDE_DATA.edges.forEach(e=>{cc.t+=e.ct;cc.e+=e.ce;cc.r+=e.cr;cc.p+=e.cp;});
  REDE_DATA.nodes.forEach(n=>cc.pv+=n.c);
  document.getElementById('csm').innerHTML=`
    <div class="pr"><span class="k">Tubulação</span><span class="v cost">R$ ${(cc.t/1000).toFixed(0)}k</span></div>
    <div class="pr"><span class="k">Escavação</span><span class="v cost">R$ ${(cc.e/1000).toFixed(0)}k</span></div>
    <div class="pr"><span class="k">Reaterro</span><span class="v cost">R$ ${(cc.r/1000).toFixed(0)}k</span></div>
    <div class="pr"><span class="k">Reposição</span><span class="v cost">R$ ${(cc.p/1000).toFixed(0)}k</span></div>
    <div class="pr"><span class="k">PVs/PIs</span><span class="v cost">R$ ${(cc.pv/1000).toFixed(0)}k</span></div>
    <div class="pr" style="border-top:1px solid var(--brd);margin-top:3px;padding-top:3px"><span class="k"><b>TOTAL</b></span><span class="v cost"><b>R$ ${((cc.t+cc.e+cc.r+cc.p+cc.pv)/1000).toFixed(0)}k</b></span></div>`;
}

// ═══ Render ═══
function onResize(){const w=cv.parentElement.clientWidth,h=cv.parentElement.clientHeight;cam.aspect=w/h;cam.updateProjectionMatrix();ren.setSize(w,h);}
window.addEventListener('resize',onResize);
function animate(){requestAnimationFrame(animate);ren.render(scene,cam);}
onResize();buildNetwork();updCam();updStats();animate();
</script>
</body>
</html>
