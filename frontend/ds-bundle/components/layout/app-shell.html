<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppShell Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a1628; padding: 0; font-family: system-ui, sans-serif; margin: 0; }
  </style>
</head>
<body>
  <div class="flex flex-col h-screen overflow-hidden">
    <!-- Demo Banner -->
    <div class="flex items-center justify-center gap-2 px-4 py-1.5 bg-[#2abfdc] text-white text-xs font-semibold shrink-0">
      🧪 Modo Demonstração Ativo — os dados exibidos são fictícios
    </div>

    <div class="flex flex-1 overflow-hidden">
      <!-- Sidebar -->
      <aside class="flex flex-col shrink-0 border-r border-[#20406a] bg-[#0d2040] w-[200px]">
        <!-- Logo -->
        <div class="flex items-center h-14 border-b border-[#20406a] shrink-0 px-[14px] gap-3">
          <div class="w-9 h-9 rounded-xl bg-[#071422] flex items-center justify-center border border-[#2abfdc]/30">
            <svg width="20" height="24" viewBox="0 0 36 44" fill="none" stroke="#2abfdc" stroke-width="2.4">
              <path d="M18 2 C18 2 33 17 33 28 C33 37.2 26.3 43 18 43 C9.7 43 3 37.2 3 28 C3 17 18 2 18 2Z" />
              <path d="M18 12 C18 12 27 23 27 29.5 C27 35.5 23 39.5 18 39.5 C13 39.5 9 35.5 9 29.5 C9 23 18 12 18 12Z" />
            </svg>
          </div>
          <div class="flex flex-col leading-none">
            <span class="text-sm font-bold text-[#e4f2f8]">Atlântico</span>
            <span class="text-[9px] font-medium tracking-widest uppercase text-[#2abfdc] opacity-80">Plataforma</span>
          </div>
        </div>

        <!-- Nav -->
        <nav class="flex flex-col flex-1 gap-0.5 p-2 pt-3 overflow-y-auto">
          <a href="#" class="flex items-center gap-3 h-10 px-[10px] rounded-lg bg-[#2abfdc]/12 text-[#2abfdc]">
            <span>📊</span>
            <span class="text-xs font-medium">Gestão 360</span>
          </a>
          <a href="#" class="flex items-center gap-3 h-10 px-[10px] rounded-lg text-[#6b6b6b] hover:bg-[#14294e]">
            <span>📋</span>
            <span class="text-xs font-medium">Relatório 360</span>
          </a>
          <a href="#" class="flex items-center gap-3 h-10 px-[10px] rounded-lg text-[#6b6b6b] hover:bg-[#14294e]">
            <span>📅</span>
            <span class="text-xs font-medium">Agenda</span>
          </a>
          <a href="#" class="flex items-center gap-3 h-10 px-[10px] rounded-lg text-[#6b6b6b] hover:bg-[#14294e]">
            <span>🔧</span>
            <span class="text-xs font-medium">Gest. Equip.</span>
          </a>
        </nav>

        <!-- Bottom -->
        <div class="p-2 border-t border-[#20406a]">
          <div class="flex items-center gap-3 h-10 px-[10px] rounded-lg text-[#6b6b6b]">
            <span>☀️</span>
            <span class="text-xs font-medium">Escuro</span>
          </div>
        </div>
      </aside>

      <!-- Main -->
      <main class="flex-1 overflow-y-auto min-w-0 p-6">
        <div class="bg-[#112645] border border-[#20406a] rounded-xl p-6">
          <h1 class="text-lg font-bold text-[#f5f5f5] mb-2">Dashboard Principal</h1>
          <p class="text-sm text-[#a3a3a3]">Bem-vindo à plataforma ConstruDataMax</p>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
