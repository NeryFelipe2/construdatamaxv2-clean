<!-- @dsCard group="UI" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a1628; padding: 2rem; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="space-y-4 max-w-sm">
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wider text-[#a3a3a3] mb-2">Label</label>
      <input type="text" placeholder="Digite aqui..." class="flex h-9 w-full rounded-lg border border-[#20406a] bg-[#0d2040] px-3 py-2 text-sm text-[#f5f5f5] shadow-sm transition-shadow placeholder:text-[#6b6b6b] focus-visible:border-[#2abfdc] focus-visible:outline-none focus-visible:ring-[3px] focus-visible:ring-[#2abfdc]/20">
    </div>

    <div>
      <label class="block text-xs font-semibold uppercase tracking-wider text-[#a3a3a3] mb-2">Search Input</label>
      <input type="search" placeholder="Buscar..." class="flex h-9 w-full rounded-lg border border-[#20406a] bg-[#0d2040] px-3 py-2 text-sm text-[#f5f5f5] shadow-sm transition-shadow placeholder:text-[#6b6b6b] focus-visible:border-[#2abfdc] focus-visible:outline-none focus-visible:ring-[3px] focus-visible:ring-[#2abfdc]/20 [&::-webkit-search-cancel-button]:appearance-none [&::-webkit-search-decoration]:appearance-none">
    </div>

    <div>
      <label class="block text-xs font-semibold uppercase tracking-wider text-[#a3a3a3] mb-2">Disabled Input</label>
      <input type="text" disabled placeholder="Desabilitado..." class="flex h-9 w-full rounded-lg border border-[#20406a] bg-[#0d2040] px-3 py-2 text-sm text-[#f5f5f5] shadow-sm placeholder:text-[#6b6b6b] disabled:cursor-not-allowed disabled:opacity-50">
    </div>

    <div>
      <label class="block text-xs font-semibold uppercase tracking-wider text-[#a3a3a3] mb-2">Com Ícone</label>
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#6b6b6b]">@</span>
        <input type="text" placeholder="Email" class="flex h-9 w-full rounded-lg border border-[#20406a] bg-[#0d2040] pl-9 pr-3 py-2 text-sm text-[#f5f5f5] shadow-sm transition-shadow placeholder:text-[#6b6b6b] focus-visible:border-[#2abfdc] focus-visible:outline-none focus-visible:ring-[3px] focus-visible:ring-[#2abfdc]/20">
      </div>
    </div>
  </div>
</body>
</html>
