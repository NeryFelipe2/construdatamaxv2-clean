version: "3.8"

services:
  # ---------- POSTGRESQL ----------
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=rk_admin
      - POSTGRES_PASSWORD=RkEng2026!SecurePass
      - POSTGRES_DB=rk_main
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - rk_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rk_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- REDIS ----------
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass RkRedis2026!Pass
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - rk_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "RkRedis2026!Pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- N8N ----------
  n8n:
    image: n8nio/n8n:latest
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=rk_main
      - DB_POSTGRESDB_USER=rk_admin
      - DB_POSTGRESDB_PASSWORD=RkEng2026!SecurePass
      - EXECUTIONS_MODE=regular
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_ENCRYPTION_KEY=rk-eng-lingma-china-2026-unica
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_DEFAULT_LOCALE=pt-BR
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - rk_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------- EVOLUTION API ----------
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    environment:
      - SERVER_URL=http://localhost:8080
      - SERVER_PORT=8080
      - AUTHENTICATION_API_KEY=construdata2026
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://rk_admin:RkEng2026!SecurePass@postgres:5432/rk_main?schema=evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_rk
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:RkRedis2026!Pass@redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution_rk
      - CACHE_LOCAL_ENABLED=false
      - RABBITMQ_ENABLED=false
      - WEBHOOK_GLOBAL_ENABLED=false
      - DEL_INSTANCE=false
      - DEL_TEMP_INSTANCES=true
      - OPENAI_ENABLED=true
      - LOG_LEVEL=WARN
      - LOG_COLOR=true
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      - CORS_CREDENTIALS=true
      - TZ=America/Sao_Paulo
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_data:/evolution/store
    networks:
      - rk_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  evolution_instances:
  evolution_data:

networks:
  rk_network:
    driver: bridge
