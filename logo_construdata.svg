<svg xmlns="http://www.w3.org/2000/svg" width="520" height="130" viewBox="0 0 520 130">
  <!-- Background -->
  <rect width="520" height="130" fill="#06060f" rx="10"/>

  <!-- Hexagon icon -->
  <polygon points="56,12 88,30 88,66 56,84 24,66 24,30"
           fill="#00ff88" stroke="none"/>

  <!-- Pipe network inside hex (4 nodes + connections) -->
  <!-- Central node -->
  <circle cx="56" cy="48" r="5.5" fill="#06060f"/>
  <!-- Top node -->
  <circle cx="56" cy="28" r="3.5" fill="#06060f"/>
  <!-- Bottom-left node -->
  <circle cx="40" cy="62" r="3.5" fill="#06060f"/>
  <!-- Bottom-right node -->
  <circle cx="72" cy="62" r="3.5" fill="#06060f"/>
  <!-- Connections -->
  <line x1="56" y1="32" x2="56" y2="42" stroke="#06060f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="53" x2="43" y2="59" stroke="#06060f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="53" x2="69" y2="59" stroke="#06060f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Water drop accent on center node -->
  <circle cx="56" cy="48" r="3" fill="#00ff88" stroke="#06060f" stroke-width="1.5"/>

  <!-- Vertical accent bar -->
  <rect x="104" y="14" width="2" height="102" fill="#00ff88" opacity="0.35" rx="1"/>

  <!-- CONSTRUDATA main text -->
  <text x="118" y="54"
        fill="#ffffff"
        font-family="'Segoe UI', 'Arial', sans-serif"
        font-size="32"
        font-weight="700"
        letter-spacing="1">CONSTRUDATA</text>

  <!-- HydroNetwork subtitle -->
  <text x="119" y="76"
        fill="#00aaff"
        font-family="'Segoe UI', 'Arial', sans-serif"
        font-size="15"
        font-weight="400"
        letter-spacing="3">HydroNetwork</text>

  <!-- Version pill -->
  <rect x="119" y="87" width="40" height="17" rx="5" fill="#00ff88"/>
  <text x="139" y="100"
        fill="#000000"
        font-family="'Segoe UI', 'Arial', sans-serif"
        font-size="10"
        font-weight="700"
        text-anchor="middle">v 9.0</text>

  <!-- Tagline -->
  <text x="165" y="100"
        fill="#4b5563"
        font-family="'Segoe UI', 'Arial', sans-serif"
        font-size="10">BIM · GIS · NS · Cronograma · Gestao</text>

  <!-- Bottom accent line -->
  <rect x="0" y="124" width="520" height="3" fill="#00ff88" rx="0"/>
  <rect x="0" y="124" width="100" height="3" fill="#00aaff" rx="0"/>
</svg>
