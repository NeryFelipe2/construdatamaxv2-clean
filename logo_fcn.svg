<svg xmlns="http://www.w3.org/2000/svg" width="480" height="130" viewBox="0 0 480 130">
  <!-- Background -->
  <rect width="480" height="130" fill="#ffffff" rx="10"/>

  <!-- Circle emblem -->
  <circle cx="65" cy="65" r="52" fill="#0a2140"/>
  <circle cx="65" cy="65" r="44" fill="none" stroke="#1565c0" stroke-width="2.5"/>

  <!-- Stylized water pipe cross (infrastructure icon) -->
  <!-- Horizontal main pipe -->
  <rect x="32" y="60" width="66" height="10" rx="5" fill="#42a5f5"/>
  <!-- Vertical branch -->
  <rect x="60" y="36" width="10" height="34" rx="5" fill="#42a5f5"/>
  <!-- Flow nodes -->
  <circle cx="38"  cy="65" r="5" fill="#ffffff"/>
  <circle cx="65"  cy="42" r="5" fill="#ffffff"/>
  <circle cx="92"  cy="65" r="5" fill="#00c4ff"/>
  <!-- Junction highlight -->
  <circle cx="65"  cy="65" r="7" fill="#ffffff"/>
  <circle cx="65"  cy="65" r="4" fill="#0a2140"/>

  <!-- FCN large text -->
  <text x="138" y="62"
        fill="#0a2140"
        font-family="'Segoe UI', 'Arial Black', sans-serif"
        font-size="44"
        font-weight="900"
        letter-spacing="2">FCN</text>

  <!-- Accent underline -->
  <rect x="138" y="70" width="148" height="4" rx="2" fill="#1565c0"/>
  <rect x="138" y="70" width="44"  height="4" rx="2" fill="#00c4ff"/>

  <!-- Company name -->
  <text x="139" y="92"
        fill="#1565c0"
        font-family="'Segoe UI', 'Arial', sans-serif"
        font-size="13.5"
        font-weight="600"
        letter-spacing="0.5">Construcoes e Saneamento</text>

  <!-- Location + contract -->
  <text x="139" y="110"
        fill="#6b7280"
        font-family="'Segoe UI', 'Arial', sans-serif"
        font-size="10.5">Santos / SP  ·  Contrato 11481051  ·  SABESP SLNR</text>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="480" height="4" fill="#1565c0" rx="2"/>
  <rect x="0" y="0" width="90"  height="4" fill="#00c4ff" rx="2"/>
</svg>
